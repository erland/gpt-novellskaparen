name: Build release distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original GPT Byggaren v1.6.13 engine
        uses: actions/checkout@v4
        with:
          repository: erland/gpt-byggaren
          ref: v1.6.13
          path: .canonical-engine-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install canonical engine
        run: python .canonical-engine-source/scripts/install_distribution_engine.py --source .canonical-engine-source --project-root .
      - name: Remove temporary engine checkout before packaging
        run: rm -rf .canonical-engine-source
      - name: Lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}" --targets project,chat,plugin,claude_project,claude_skills,opencode
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify reproducible release
        shell: bash
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS.txt /tmp/release-first-build.sha256
          python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}" --targets project,chat,plugin,claude_project,claude_skills,opencode
          diff -u /tmp/release-first-build.sha256 dist/SHA256SUMS.txt
      - name: Verify release filenames
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          test -f "dist/novellskaparen-project-${VERSION}.zip"
          test -f "dist/novellskaparen-chat-${VERSION}.zip"
          test -f "dist/novellskaparen-plugin-${VERSION}.zip"
          test -f "dist/novellskaparen-claude-project-${VERSION}.zip"
          test -f "dist/novellskaparen-claude-skills-${VERSION}.zip"
          test -f "dist/novellskaparen-opencode-${VERSION}.zip"
          test -f dist/SHA256SUMS.txt
          test -f dist/DELIVERY-MANIFEST.json
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/novellskaparen-project-${VERSION}.zip" \
            "dist/novellskaparen-chat-${VERSION}.zip" \
            "dist/novellskaparen-plugin-${VERSION}.zip" \
            "dist/novellskaparen-claude-project-${VERSION}.zip" \
            "dist/novellskaparen-claude-skills-${VERSION}.zip" \
            "dist/novellskaparen-opencode-${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            dist/DELIVERY-MANIFEST.json \
            --clobber
