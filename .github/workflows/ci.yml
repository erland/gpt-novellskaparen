name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: Lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,custom-gpt,claude
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Validate runtime parity
        run: python scripts/validate_runtime_parity.py
      - name: Validate release readiness
        run: python scripts/validate_release_readiness.py
      - name: Final project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final
      - name: Validate workflow parity
        run: python scripts/validate_workflow_parity.py
      - name: Verify reproducible build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS.txt /tmp/first-build.sha256
          python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,custom-gpt,claude
          diff -u /tmp/first-build.sha256 dist/SHA256SUMS.txt
