name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical engine v1.6.17
        uses: actions/checkout@v4
        with:
          repository: erland/gpt-byggaren
          ref: v1.6.17
          path: .canonical-engine-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml pytest
      - name: Install original canonical distribution engine
        run: |
          python .canonical-engine-source/scripts/install_distribution_engine.py \
            --source .canonical-engine-source --project-root .
      - name: Remove temporary engine checkout before packaging
        run: rm -rf .canonical-engine-source
      - name: Verify exact modular canonical assembly
        run: python scripts/compile_canonical_skills.py --check
      - name: Check canonical contract
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Build all five runtime distributions
        run: |
          python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,plugin,claude_project,claude_skills,opencode
      - name: Validate outputs
        run: |
          python scripts/validate_distributions.py --project-root .
          test -f dist/SHA256SUMS.txt
          test -f dist/DELIVERY-MANIFEST.json
      - name: Verify all six archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for target in project chat plugin claude-project claude-skills opencode; do
            test -f "novellskaparen-${target}-0.0.0-ci.zip"
          done
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archives = sorted(Path(".").glob("*.zip"))
          assert len(archives) == 6, f"Expected six ZIPs, found {len(archives)}"
          for path in archives:
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None, f"Corrupt ZIP: {path}"
                  assert not any(p.startswith(".canonical-engine-source/") or p.startswith(".git/") for p in z.namelist()), path
          print("PASS: 6 valid archives, no temporary engine checkout")
          PY
      - name: Upload build for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novellskaparen-migration-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: warn
      - name: Run project regression tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify reproducible build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS.txt /tmp/first-build.sha256
          python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,plugin,claude_project,claude_skills,opencode
          diff -u /tmp/first-build.sha256 dist/SHA256SUMS.txt
